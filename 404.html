<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballin World Wide // 404</title>
    <!-- Sitenin ana CSS'i çağrılsa bile aşağıdaki kodlar onu ezecektir -->
    <style>
        /* 404 Özel Kapsayıcı (CSS Reset ve İzolasyon) */
        #bww-error-page {
            all: initial !important; /* Diğer tüm dış CSS kurallarını sıfırlar */
            font-family: 'Courier New', Courier, monospace !important;
            background-color: #050505 !important;
            color: #ffffff !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            height: 100vh !important;
            width: 100vw !important;
            position: fixed !important; /* Sayfanın kaymasını engeller */
            top: 0 !important;
            left: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            text-align: center !important;
            box-sizing: border-box !important;
            
            /* Siber-Gotik Grid Arka Plan */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) !important;
            background-size: 40px 40px !important;
            z-index: 99999 !important;
        }

        /* Üst Ufak Yazı */
        #bww-error-page .top-text {
            color: #444 !important;
            font-size: 0.9rem !important;
            letter-spacing: 4px !important;
            margin-bottom: 20px !important;
            text-transform: uppercase !important;
        }

        /* 404 Krom Efekti */
        #bww-error-page .error-title {
            font-size: clamp(100px, 20vw, 250px) !important;
            font-weight: 900 !important;
            margin: 0 !important;
            line-height: 1 !important;
            /* Metalik Parlama Gradienti */
            background: linear-gradient(180deg, #ffffff 0%, #777777 48%, #111111 50%, #888888 55%, #dddddd 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0px 0px 25px rgba(255,255,255,0.15)) !important;
            letter-spacing: -5px !important;
            padding: 0 20px !important;
        }

        /* Hata Alt Başlığı */
        #bww-error-page .error-subtitle {
            font-size: clamp(1.5rem, 4vw, 3rem) !important;
            font-weight: bold !important;
            letter-spacing: 8px !important;
            margin-top: 20px !important;
            text-transform: uppercase !important;
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(255,255,255,0.5) !important;
        }

        #bww-error-page .error-text {
            color: #00bcd4 !important; /* Y2K stili hafif siber mavi bir dokunuş */
            margin-top: 15px !important;
            font-size: 1.1rem !important;
            letter-spacing: 3px !important;
        }

        /* Fırçalanmış Metal Buton */
        #bww-error-page .back-btn {
            margin-top: 50px !important;
            padding: 15px 40px !important;
            background: linear-gradient(180deg, #e6e6e6 0%, #999999 100%) !important;
            color: #000000 !important;
            text-decoration: none !important;
            font-weight: 900 !important;
            font-size: 1.1rem !important;
            border: 1px solid #ffffff !important;
            border-radius: 3px !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 20px rgba(0,0,0,0.8) !important;
            transition: all 0.2s ease-in-out !important;
            cursor: pointer !important;
            text-transform: uppercase !important;
            letter-spacing: 2px !important;
        }

        #bww-error-page .back-btn:hover {
            background: linear-gradient(180deg, #ffffff 0%, #bbbbbb 100%) !important;
            transform: translateY(-2px) !important;
            box-shadow: inset 0 1px 0 #ffffff, 0 15px 25px rgba(255,255,255,0.15) !important;
        }
    </style>
</head>
<!-- Body'deki olası marginleri ve kaydırma çubuğunu gizliyoruz -->
<body style="margin: 0 !important; padding: 0 !important; overflow: hidden !important; background-color: #050505 !important;">
    
    <div id="bww-error-page">
        <div class="top-text">BALLIN WORLD WIDE // ERROR SYSTEM</div>
        <div class="error-title">404</div>
        <div class="error-subtitle">SAYFA BULUNAMADI</div>
        <div class="error-text">[ KAYBOLDUN SANIRIM ]</div>
        <a href="/" class="back-btn">← ANA SAYFAYA DÖN</a>
    </div>

</body>
</html>
