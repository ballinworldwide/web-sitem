<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | Ballin World Wide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Y2K & Gothic Vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base & Resets */
        body {
            background-color: #030303;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden; /* Prevent scrolling for the full-screen effect */
        }

        /* Ambient Metallic Reflections */
        .ambient-light {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(160, 165, 175, 0.15) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }
        .light-1 { top: -20%; left: -10%; width: 60vw; height: 60vw; }
        .light-2 { bottom: -30%; right: -10%; width: 70vw; height: 70vw; }

        /* Y2K Cyber-Gothic Typography */
        .font-syncopate {
            font-family: 'Syncopate', sans-serif;
        }

        /* Chrome Text Effect */
        .chrome-text {
            background-image: linear-gradient(
                to bottom,
                #ffffff 0%,
                #b0b5bc 30%,
                #2a2a2a 48%,
                #000000 50%,
                #5a5e65 55%,
                #d3d7df 75%,
                #ffffff 100%
            );
            background-size: 100% 150%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 25px rgba(255, 255, 255, 0.2));
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* Subtle Monochrome Glitch Animation */
        .glitch-wrapper {
            position: relative;
        }
        
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to bottom, #ffffff 0%, #b0b5bc 30%, #2a2a2a 48%, #000000 50%, #5a5e65 55%, #d3d7df 75%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.8;
            z-index: -1;
        }

        .glitch-text::before {
            left: 3px;
            text-shadow: -2px 0 #ffffff;
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -3px;
            text-shadow: 2px 0 rgba(150, 150, 150, 0.5);
            animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, 1px); }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, -1px); }
            40% { clip-path: inset(30% 0 20% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(5% 0 80% 0); transform: translate(-2px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, 1px); }
            100% { clip-path: inset(20% 0 60% 0); transform: translate(-1px, -1px); }
        }

        /* Brushed Metal Button */
        .btn-metal {
            background: linear-gradient(
                135deg, 
                #f0f0f0 0%, 
                #a8a8a8 25%, 
                #ffffff 50%, 
                #8a8a8a 75%, 
                #e0e0e0 100%
            );
            background-size: 200% auto;
            color: #050505;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.8), 
                inset 0 1px 3px rgba(255, 255, 255, 0.9),
                inset 0 -2px 5px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            font-weight: 700;
        }

        .btn-metal::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.6s ease;
        }

        .btn-metal:hover {
            background-position: right center;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 10px 25px rgba(255, 255, 255, 0.15), 
                inset 0 1px 3px rgba(255, 255, 255, 0.9),
                inset 0 -2px 5px rgba(0, 0, 0, 0.4);
            color: #000000;
        }

        .btn-metal:hover::before {
            left: 200%;
        }
        
        .btn-metal:active {
            transform: translateY(1px);
        }

        /* Grid Background Pattern for Tech Vibe */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            opacity: 0.5;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center min-h-screen w-full selection:bg-gray-300 selection:text-black">

    <!-- Background Elements -->
    <div class="bg-grid"></div>
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <!-- Main Content -->
    <main class="relative z-10 flex flex-col items-center text-center px-6 w-full max-w-4xl">
        
        <!-- Brand Watermark / Top Label -->
        <p class="text-gray-500 font-syncopate tracking-[0.3em] text-xs sm:text-sm mb-6 uppercase opacity-60">
            Ballin World Wide // Error System
        </p>

        <!-- 404 Glitch & Chrome Effect -->
        <div class="glitch-wrapper mb-2">
            <h1 class="text-[120px] leading-none sm:text-[180px] md:text-[220px] font-syncopate font-bold chrome-text glitch-text m-0 p-0 tracking-tighter" data-text="404">
                404
            </h1>
        </div>

        <!-- Messaging -->
        <div class="mt-4 mb-10 flex flex-col gap-2">
            <h2 class="text-2xl sm:text-3xl md:text-4xl font-syncopate font-bold tracking-widest uppercase text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                Sayfa Bulunamadı
            </h2>
            <p class="text-gray-400 text-lg sm:text-xl font-medium tracking-wider">
                [ KAYBOLDUN SANIRIM ]
            </p>
        </div>

        <!-- Brushed Metal Return Button -->
        <a href="/" class="btn-metal px-10 py-4 rounded-sm flex items-center gap-3 group decoration-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Ana Sayfaya Dön
        </a>

    </main>

    <!-- Decorative Corner Elements (Y2K HUD style) -->
    <div class="absolute top-6 left-6 w-8 h-8 border-t-2 border-l-2 border-gray-600 opacity-50 z-10"></div>
    <div class="absolute top-6 right-6 w-8 h-8 border-t-2 border-r-2 border-gray-600 opacity-50 z-10"></div>
    <div class="absolute bottom-6 left-6 w-8 h-8 border-b-2 border-l-2 border-gray-600 opacity-50 z-10"></div>
    <div class="absolute bottom-6 right-6 w-8 h-8 border-b-2 border-r-2 border-gray-600 opacity-50 z-10"></div>

    <!-- Script for subtle mouse tracking reflection (Optional but adds premium feel) -->
    <script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const chromeText = document.querySelector('.chrome-text');
            // Slightly shift the background position of the chrome text based on mouse position to simulate reflection
            if(chromeText) {
                chromeText.style.backgroundPosition = `${x * 100}% ${y * 100}%`;
            }
        });
    </script>
</body>
</html>
